---
# Pushes a baseline config to the 5 routers in the [routers] group defined
# in inventory.ini: hostname plus a description/admin-state/IP address for
# each interface listed in host_vars/<router>.yml.
#
# Before running:
#   1. ansible-galaxy collection install -r requirements.yml
#   2. Set each router's ansible_host in inventory.ini to its CML mgmt IP
#   3. Edit host_vars/R1.yml .. R5.yml for your topology
#
# Run with:
#   ansible-playbook -i inventory.ini CML-CONFIG-PUSH.yml

- name: Push baseline config to CML routers
  hosts: routers
  gather_facts: false
  connection: network_cli

  tasks:
    - name: Set the router hostname
      cisco.ios.ios_config:
        lines:
          - "hostname {{ hostname }}"

    - name: Configure each interface (description, admin state, IP address)
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines:
          - "description {{ item.description }}"
          - "ip address {{ item.ip_address }} {{ item.ip_mask }}"
          - "{{ 'no shutdown' if item.enabled else 'shutdown' }}"
      loop: "{{ interfaces }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Save running-config to startup-config
      cisco.ios.ios_config:
        save_when: modified

    - name: Confirm the hostname took effect
      cisco.ios.ios_command:
        commands:
          - show running-config | include ^hostname
      register: hostname_check

    - name: Show confirmed hostname
      debug:
        var: hostname_check.stdout_lines
