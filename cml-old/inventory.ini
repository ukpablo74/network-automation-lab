[pi] # My Raspberry Pi 5 server used for the 101 Ansible Course
raspberrypi ansible_host=192.168.1.243 ansible_user=ukpablo
# IP address of the server with user name

[routers] # 5 routers running in CML, configured by CML-CONFIG-PUSH.yml
R1 ansible_host=192.168.1.101
R2 ansible_host=192.168.1.102
R3 ansible_host=192.168.1.103
R4 ansible_host=192.168.1.104
R5 ansible_host=192.168.1.105
# Replace each ansible_host above with the router's CML management IP
# (the address reachable from this machine, e.g. via an external connector)

[routers:vars]
ansible_connection=network_cli
ansible_network_os=ios
ansible_user=cisco
ansible_password=cisco
ansible_become=true
ansible_become_method=enable
# For anything beyond a throwaway lab, move ansible_password (and
# ansible_become_password if the enable secret differs) into a file
# encrypted with ansible-vault instead of leaving them here in plain text.